spring.application.name=vmd-studio

# ----- DB: H2를 파일로 저장 (서버를 다시 켜도 데이터 유지) -----
# 프로젝트 폴더 안의 data/ 에 저장된다. 처음 상태로 되돌리려면 서버를 끄고 data 폴더를 지운다.
spring.datasource.url=jdbc:h2:file:./data/vmd-studio
spring.datasource.username=sa
spring.datasource.password=
# Entity 구조에 맞춰 테이블을 자동으로 만들고 고친다 (Prototype 단계 설정)
spring.jpa.hibernate.ddl-auto=update
# 브라우저에서 DB 내용 확인: http://localhost:8080/h2-console (JDBC URL은 위 값과 같게 입력)
spring.h2.console.enabled=true

# 서버 오류 응답에 안내 문구(message)를 포함한다 (화면 alert에 표시)
server.error.include-message=always

# ----- 이미지 업로드 -----
# 업로드한 이미지가 저장되는 폴더 (프로젝트 폴더 안의 uploads/, Git에는 올라가지 않음)
vmd.upload-dir=uploads
# Store Setup 안내 문구와 같은 기준: 이미지 1장 10MB 이하 (요청 전체는 사진 2장 + 글자)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=25MB

# ----- AI Preview (Week 2: Mock) -----
# MockPreviewGenerator가 돌려주는 예시 이미지 주소. 입력과 관계없이 항상 이 이미지가 나온다.
# AnyDoor 사전 실험 #03A 결과 이미지를 src/main/resources/static/mock/ 에 넣고 아래 주소를 바꾸면 된다.
# 예: vmd.preview.mock-image-url=/mock/poc-03a-result.png
vmd.preview.mock-image-url=/mock/mock-preview.svg
