<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VMD Studio · DP Editor</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header id="app-header"></header>

<main class="page">
    <div class="page-title-row">
        <h1>Select Area<span class="title-ko">변경 영역 지정</span></h1>
    </div>

    <!-- 안내 문구 (화면 기능 명세 v0.2 확정 문구 + 10/31 입력 가이드, D24) -->
    <section class="notice">
        교체하거나 배치할 영역을 지정해주세요.<br>
        영역의 위치와 크기는 Preview 결과에 영향을 줄 수 있습니다.
        <ul class="guide-list">
            <li>바꿀 상품 <strong>하나만</strong> 감싸 주세요. 옷걸이·후크는 영역에서 빼 주세요.</li>
            <li>영역은 <strong>상품 모양(가로·세로 비율)에 가깝게</strong> 그려 주세요. AI는 영역을 그대로 채우기 때문에, 영역이 상품보다 길면 옷도 길게 늘어납니다.</li>
        </ul>
    </section>

    <section class="editor-layout">
        <!-- 왼쪽: 매장 사진 + 지정 영역 -->
        <div class="card">
            <div class="photo-canvas is-disabled" id="photo-canvas">
                <div class="photo-placeholder">
                    <span id="photo-message">매장 사진 불러오는 중...</span>
                </div>
                <!-- 지정한 영역: 안쪽을 끌면 이동, 네 모서리를 끌면 크기 조절 -->
                <div class="region-box" id="region-box" hidden>
                    <span class="region-handle handle-nw" data-handle="nw"></span>
                    <span class="region-handle handle-ne" data-handle="ne"></span>
                    <span class="region-handle handle-sw" data-handle="sw"></span>
                    <span class="region-handle handle-se" data-handle="se"></span>
                    <!-- 변 가운데 핸들: 가로 또는 세로 한 방향만 늘리고 줄인다 (10/12 사용자 제안) -->
                    <span class="region-handle handle-n" data-handle="n"></span>
                    <span class="region-handle handle-s" data-handle="s"></span>
                    <span class="region-handle handle-w" data-handle="w"></span>
                    <span class="region-handle handle-e" data-handle="e"></span>
                </div>
            </div>
        </div>

        <!-- 오른쪽: 적용 상품 (읽기 전용) + 영역 상태 -->
        <div class="card">
            <h2 class="section-title">적용 상품</h2>
            <div class="product-card-image">상품 이미지</div>
            <dl class="info-list">
                <dt>상품명</dt>
                <dd id="product-name"></dd>
                <dt>품번</dt>
                <dd id="product-code"></dd>
                <dt>컬러</dt>
                <dd id="product-color"></dd>
            </dl>
            <p class="hint">상품 수정은 이전 단계(등록)에서 합니다.</p>

            <div class="region-status" id="region-status">영역: 미지정</div>
            <!-- 영역 비율과 상품 비율 비교 (10/29 실험 A1: 결과는 영역 사각형을 그대로 채운다) -->
            <p class="ratio-hint" id="ratio-hint" hidden></p>
        </div>
    </section>

    <section class="action-bar">
        <div class="button-group">
            <a class="btn" id="prev-link" href="/setup.html">← 이전: 등록</a>
            <button type="button" class="btn" id="reset-button">영역 다시 그리기</button>
        </div>
        <button type="button" class="btn btn-primary" id="preview-button" disabled>Preview 생성 →</button>
    </section>
</main>

<script src="/js/common.js"></script>
<script src="/js/editor.js"></script>
</body>
</html>
