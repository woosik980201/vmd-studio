<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VMD Studio · DP Plan</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header id="app-header"></header>

<main class="page">
    <!-- [Prototype 전용] 보기 상태 미리보기 중일 때만 보인다 -->
    <section class="prototype-bar" id="prototype-bar" hidden>
        <span>매장 직원 화면 미리보기 중</span>
        <button type="button" class="btn" id="back-to-edit-button">작성 상태로 돌아가기</button>
    </section>

    <!-- VMD 전용: 공유 완료 작업을 VMD가 열었을 때만 보인다 (직원용 주소 mode=view에서는 숨김)
         공유 직후 '공유됐다'는 확인 + 다음 행동(대시보드로 / 공유 취소)을 함께 보여준다 (10/12) -->
    <section class="owner-bar" id="owner-bar" hidden>
        <span><strong class="owner-bar-done">✓ 매장에 공유된 DP Plan입니다</strong> · 수정하려면 공유를 먼저 취소해야 합니다</span>
        <div class="button-group">
            <a class="btn" href="/">← 대시보드로</a>
            <button type="button" class="btn" id="unshare-button">공유 취소하고 수정</button>
        </div>
    </section>

    <div class="page-title-row">
        <h1>Display Plan<span class="title-ko">DP Plan</span></h1>
    </div>

    <!-- 상태 안내 띠: 작성 상태와 보기 상태에서 문구가 다르다 -->
    <section class="state-banner" id="state-banner"></section>

    <!-- 이미지 3칸 같은 크기 (Wireframe v0.2 결정) -->
    <section class="image-grid cols-3">
        <figure class="image-panel">
            <figcaption>BEFORE <span class="hint">현재 매장</span></figcaption>
            <div class="image-placeholder"><span>인물 사진</span></div>
        </figure>
        <figure class="image-panel">
            <figcaption>AI PREVIEW <span class="hint">배치 참고용</span></figcaption>
            <div class="image-placeholder"><span>채택한 Preview</span></div>
        </figure>
        <figure class="image-panel">
            <figcaption>PRODUCT <span class="hint">실제 상품 · SKU 확인 기준</span></figcaption>
            <div class="image-placeholder"><span>실제 상품 이미지</span></div>
        </figure>
    </section>

    <!-- 상품 정보 (+ 작성 상태에서만 VMD 메모) -->
    <section class="card">
        <h2 class="section-title">상품 정보</h2>
        <dl class="info-inline">
            <div>
                <dt>상품명</dt>
                <dd id="plan-product-name"></dd>
            </div>
            <div>
                <dt>품번</dt>
                <dd id="plan-product-code"></dd>
            </div>
            <div>
                <dt>컬러</dt>
                <dd id="plan-product-color"></dd>
            </div>
        </dl>
        <div class="memo-row" id="memo-row">
            <span class="hint">VMD 메모 (내부 참고용 · 매장 직원에게 표시되지 않음)</span>
            <p class="memo-text" id="vmd-memo"></p>
        </div>
    </section>

    <!-- VMD 작업 지시: 작성 상태는 입력 칸, 보기 상태는 일반 글자 -->
    <section class="card">
        <h2 class="section-title">VMD 작업 지시</h2>
        <textarea class="instruction-input" id="instruction-input"
                  placeholder="매장 직원에게 전달할 작업 내용을 입력하세요."></textarea>
        <div class="instruction-text" id="instruction-text" hidden></div>
        <!-- 저장 상태 표시 (A안, 10/12 결정): 수정 중 / 저장 중 / 저장됨 / 저장 실패 -->
        <div class="save-status" id="save-status" aria-live="polite"></div>
    </section>

    <section class="notice">
        Preview는 배치 참고용이며 실제 상품은 상품 이미지와 정보를 기준으로 준비해주세요.
    </section>

    <!-- 하단 행동 영역: 작성 상태에서만 보인다 -->
    <section class="action-bar" id="action-bar">
        <div class="button-group">
            <a class="btn" id="back-to-preview-link" href="/preview.html">← Preview로</a>
            <button type="button" class="btn" id="view-preview-button">직원 화면 미리보기</button>
        </div>
        <div class="button-group">
            <button type="button" class="btn" id="complete-button" disabled>작성 완료</button>
            <button type="button" class="btn btn-primary" id="share-button" disabled>매장에 공유</button>
        </div>
    </section>
</main>

<script src="/js/common.js"></script>
<script src="/js/plan.js"></script>
</body>
</html>
